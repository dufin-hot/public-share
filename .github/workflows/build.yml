name: Build RK322x Server

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            cpio \
            file \
            git \
            rsync \
            unzip \
            wget \
            python3 \
            python3-pip \
            libncurses-dev \
            libssl-dev \
            libelf-dev \
            device-tree-compiler \
            xz-utils

      - name: Clone Buildroot
        run: |
          git clone --depth 1 \
            https://gitlab.com/buildroot.org/buildroot.git \
            buildroot

      - name: Apply project configuration
        run: |
          cp buildroot.config buildroot/.config

      - name: Build
        working-directory: buildroot
        run: |
          make olddefconfig
          make -j"$(nproc)"

      - name: Show generated files
        run: |
          echo "=== output/images ==="
          ls -lah buildroot/output/images

      - name: Upload Buildroot artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rk322x-build
          path: |
            buildroot/output/images/*
