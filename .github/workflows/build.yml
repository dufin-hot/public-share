name: Build RK322x Server

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            cpio \
            file \
            git \
            rsync \
            unzip \
            wget \
            xz-utils \
            libncurses-dev \
            libssl-dev \
            libelf-dev \
            device-tree-compiler \
            util-linux \
            dosfstools \
            e2fsprogs

      - name: Clone Buildroot
        run: |
          git clone --depth 1 \
            https://gitlab.com/buildroot.org/buildroot.git \
            buildroot

      - name: Clone SV6256P driver
        run: |
          git clone --depth 1 \
            https://github.com/cdhigh/armbian_sv6256p.git \
            package/ssv6x5x/src

      - name: Generate Wi-Fi configuration
        env:
          WIFI_SSID: ${{ secrets.WIFI_SSID }}
          WIFI_PASSWORD: ${{ secrets.WIFI_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          ssid = os.environ["WIFI_SSID"]
          password = os.environ["WIFI_PASSWORD"]

          def escape_wpa(value):
              return value.replace("\\", "\\\\").replace('"', '\\"')

          ssid = escape_wpa(ssid)
          password = escape_wpa(password)

          text = f'''ctrl_interface=/var/run/wpa_supplicant
          update_config=0
          country=BR

          network={{
              ssid="{ssid}"
              psk="{password}"
              key_mgmt=WPA-PSK
          }}
          '''

          path = Path(
              "board/rk322x-server/rootfs-overlay/etc/wpa_supplicant.conf"
          )
          path.write_text(text, encoding="utf-8")
          path.chmod(0o600)
          PY

      - name: Apply project configuration
        run: |
          cp buildroot.config buildroot/.config

      - name: Configure Buildroot
        working-directory: buildroot
        run: |
          make \
            BR2_EXTERNAL="$GITHUB_WORKSPACE" \
            BR2_ROOTFS_OVERLAY="$GITHUB_WORKSPACE/board/rk322x-server/rootfs-overlay" \
            BR2_SYSTEM_DHCP="eth0" \
            olddefconfig

      - name: Build
        working-directory: buildroot
        run: |
          make \
            BR2_EXTERNAL="$GITHUB_WORKSPACE" \
            BR2_ROOTFS_OVERLAY="$GITHUB_WORKSPACE/board/rk322x-server/rootfs-overlay" \
            BR2_SYSTEM_DHCP="eth0" \
            -j"$(nproc)"

      - name: Verify kernel and SV6256P
        run: |
          echo "=== Kernel ==="
          ls -lh buildroot/output/images/zImage

          echo "=== SV6256P module ==="
          find buildroot/output/target/lib/modules \
            -name 'ssv6x5x.ko' -ls

          echo "=== Firmware ==="
          ls -lh \
            buildroot/output/target/lib/firmware/ssv6x5x-sw.bin \
            buildroot/output/target/lib/firmware/ssv6x5x-wifi.cfg

          echo "=== Network configuration ==="
          cat buildroot/output/target/etc/network/interfaces

          echo "=== Modules ==="
          cat buildroot/output/target/etc/modules-load.d/ssv6x5x.conf

      - name: Download Multitool
        run: |
          wget -O multitool-rk322x.xz \
            https://github.com/dufin-hot/public-share/releases/download/RK3228A/multitool-rk322x.xz

          xz -d multitool-rk322x.xz

      - name: Build SD image
        run: |
          chmod +x scripts/make-sd-image.sh

          sudo scripts/make-sd-image.sh \
            multitool-rk322x \
            buildroot/output/images/rootfs.tar \
            buildroot/output/images/zImage \
            rk322x-server-sd.img

      - name: Inspect image
        run: |
          ls -lh rk322x-server-sd.img
          sudo fdisk -l rk322x-server-sd.img

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rk322x-server-sd
          path: |
            rk322x-server-sd.img
            buildroot/output/images/zImage
            buildroot/output/images/rootfs.tar
